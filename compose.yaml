services:
  collection:
    image: ghcr.io/jkfujr/artkeep:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ARCHIVE_ADMIN_PASSWORD: ${ARCHIVE_ADMIN_PASSWORD:-}
      ARCHIVE_PROXY: ${ARCHIVE_PROXY:-}
      ARCHIVE_COOKIES_FILE: ${ARCHIVE_COOKIES_FILE:-}
    volumes:
      - ./data:/data
      - ${PIXIV_DIR:-./pixiv}:/library/pixiv:ro
      - ./secrets:/run/collection:ro
